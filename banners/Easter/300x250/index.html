</head>

<body>

    <div id="container">

            </div>
        </div>
			<div id="egg1" class="egg"></div>
			<div id="egg2" class="egg"></div>
			<div id="egg3" class="egg"></div>
			<div id="egg5" class="egg"></div>
 			<div id="image" class="image"></div>

        <div id="frame2" class="adSize">

                <img src="cta_over.png" id="btn_cta_label_hover" class="img_svg" />

    <!-- PRELOADER -->
    <div class="hidden">
        <script type="text/javascript">
            var images = new Array()

            function preload() {
                for (i = 0; i < preload.arguments.length; i++) {
                    images[i] = new Image()
                    images[i].src = preload.arguments[i]
                }
                console.log("<<<<< PRELOADED IMAGES =", i);
            }
            preload(
                "logo.svg", "tc.png", "image.png", "starburst.svg",
                "text1a.png", "text1b.png",
                "text2a.png", "text2b.png", "text2c.png", "text2d.png",
                "cta_out.png", "cta_over.png", "Buns_Choc.png", "Buns_Trad.png",
                "egg1.png", "egg2.png", "egg3.png", "egg4.png", "egg5.png"
            )
        </script>
    </div>

    <script src="animation.js"></script>
